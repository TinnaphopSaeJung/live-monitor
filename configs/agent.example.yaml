agent:
  machine_id: "LIVE-PC-01"
  heartbeat_interval: "5s"

backend:
  enabled: true
  base_url: "http://127.0.0.1:8080"
  agent_token: "dev-agent-token"
  request_timeout: "2s"

obs:
  host: "127.0.0.1"
  port: 4455
  password: "YOUR_PASSWORD"
  audio_input: "Mic/Aux"

audio:
  signal_loss_duration: "10s"

  low_level_threshold_db: -60
  low_level_duration: "10s"
  low_level_window_duration: "1s"

  recovery_duration: "5s"